    <!-- Pick the theme before the first paint so the page never flashes the wrong one. -->
    <script>
      (function () {
        var theme = "light";
        try {
          // ?theme=light or ?theme=dark shows one theme without saving the choice.
          var asked = new URLSearchParams(location.search).get("theme");
          var saved = localStorage.getItem("theme");
          if (asked === "light" || asked === "dark") theme = asked;
          else if (saved === "light" || saved === "dark") theme = saved;
          else if (matchMedia("(prefers-color-scheme: dark)").matches)
            theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
